name: build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test ZamanliKapatma.slnx --configuration Release

      - name: Publish
        run: >
          dotnet publish src/ZamanliKapatma/ZamanliKapatma.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          --output publish

      - uses: actions/upload-artifact@v4
        with:
          name: ZamanliKapatma-win-x64
          path: publish/ZamanliKapatma.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/ZamanliKapatma.exe
